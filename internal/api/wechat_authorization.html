<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="origin">
<title>{{.Title}}</title>
<style>
:root{--background:#f6f7f9;--card:#fff;--foreground:#1f2328;--muted:#5f6670;--border:#e3e6ea;--primary:#07c160;--primary-foreground:#fff;--danger:#d1242f}
@media (prefers-color-scheme:dark){:root{--background:#15171a;--card:#1d2024;--foreground:#e8eaed;--muted:#9aa0a6;--border:#2e3238;--danger:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--background);color:var(--foreground);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{width:100%;max-width:420px;padding:32px 28px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
h1{margin:0 0 8px;font-size:20px;font-weight:600}
h1.failed{color:var(--danger)}
p{margin:0;color:var(--muted)}
a.action{display:block;margin-top:24px;padding:10px 16px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);text-align:center;text-decoration:none;font-weight:500}
</style>
</head>
<body>
<main>
<h1{{if .Failed}} class="failed"{{end}}>{{.Heading}}</h1>
<p>{{.Body}}</p>
{{if .ActionURL}}<a class="action" href="{{.ActionURL}}">{{.ActionLabel}}</a>{{end}}
</main>
</body>
</html>
