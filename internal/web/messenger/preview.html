<!DOCTYPE html>
<html lang="{{.Lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{.Title}}</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden;
        background: #f4f4f5;
      }
      .cv-preview-site {
        width: 100%;
        height: 100%;
        background: #f4f4f5;
      }
    </style>
  </head>
  <body>
    <main class="cv-preview-site" aria-label="{{.StageLabel}}"></main>
    <script src="/embed/widget.js?preview=1"></script>
  </body>
</html>
