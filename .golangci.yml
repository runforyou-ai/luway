# Go 静态检查基线，由 wails3 task check:lint 按原生端与服务端两组构建标签分别运行。
# 依赖方向、时钟、日志与 pkg 边界由 internal/tools 下的专用检查负责。
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # 命令行输出写入终端，写入失败无可处理。
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    errorlint:
      # 以 %v 格式化错误用于只保留文字、不暴露底层错误链的场景。
      errorf: false
    staticcheck:
      checks:
        - all
        # 以下为 golangci-lint 默认关闭的文档与命名风格检查。
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # 错误信息以 Telegram、Anthropic 等专有名词开头。
        - -ST1005
        # 德摩根展开与省略嵌入字段只改变写法，保留原写法的可读性。
        - -QF1001
        - -QF1008
  exclusions:
    generated: lax
    paths:
      - _gen\.go$
      - ^frontend/
      - ^build/ios/
    rules:
      # 延迟执行的关闭、回滚与删除临时文件只做清理，失败不影响结果。
      - linters: [errcheck]
        source: ^\s*defer\s
      # 读取完成或出错后关闭读取端、连接与管道，关闭失败不影响已得到的结果。
      - linters: [errcheck]
        text: "`[^`]*\\.Close` is not checked"
      # 测试辅助函数发起请求后经 t.Cleanup 关闭响应体。
      - linters: [bodyclose]
        path: _test\.go$
      # 测试以挂接查询钩子拦截共享数据库连接上的查询，WithQueryHook 返回的副本不作用于被测代码。
      - linters: [staticcheck]
        path: _test\.go$
        text: AddQueryHook is deprecated
