name: Setup toolchain
description: 安装 Node.js、Go 与 wails3 CLI，直接复用执行器本机的模块、编译和 npm 缓存。

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"
        package-manager-cache: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: false

    - name: Resolve Go toolchain paths
      id: toolchain
      shell: bash
      run: |
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        echo "wails=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" >> "$GITHUB_OUTPUT"
        {
          printf 'Go 编译缓存：`%s`\n\n' "$(go env GOCACHE)"
          printf 'Go 模块缓存：`%s`\n\n' "$(go env GOMODCACHE)"
          printf 'npm 缓存：`%s`\n\n' "$(npm config get cache)"
        } >> "$GITHUB_STEP_SUMMARY"

    # CLI 静态链接，不依赖桌面端系统库，服务端任务无需安装 GTK 与 WebKit。
    - name: Reuse or install wails3 CLI
      shell: bash
      env:
        CGO_ENABLED: "0"
        WAILS_VERSION: ${{ steps.toolchain.outputs.wails }}
      run: |
        binary="$(command -v "wails3$(go env GOEXE)" || true)"
        if [[ -n "$binary" ]] && installed="$(go version -m "$binary" | awk '$1 == "mod" && $2 == "github.com/wailsapp/wails/v3" { print $3 }')" && [[ "$installed" == "$WAILS_VERSION" ]]; then
          echo "复用 Wails CLI $WAILS_VERSION：$binary"
        else
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
        fi
