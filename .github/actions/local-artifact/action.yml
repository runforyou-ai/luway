name: Local artifact
description: 使用执行器配置的共享产物目录，在 VMPal 虚拟机之间传递文件。
inputs:
  operation:
    description: upload 或 download
    required: true
  name:
    description: 上传或下载的产物名称
  pattern:
    description: 下载的产物名称模式，支持星号
  path:
    description: 上传文件模式（每行一个），或下载目标目录
    required: true
outputs:
  artifact-path:
    description: 本机产物或下载目录
runs:
  using: node24
  main: index.js
