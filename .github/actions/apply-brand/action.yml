name: Apply brand profile
description: 从调用方仓库检出品牌目录，把其中的品牌文件和图标应用到当前源码。

inputs:
  profile:
    description: 调用方仓库中的品牌目录，如 brands/acme。
    required: true

runs:
  using: composite
  steps:
    - name: Checkout brand profile
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        path: .brand-profile
        sparse-checkout: ${{ inputs.profile }}
        persist-credentials: false

    # 应用后删除品牌目录，构建上下文只保留已应用的品牌文件。
    - name: Apply brand profile
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        go run ./build/scripts/applybrand ".brand-profile/${PROFILE}"
        rm -rf .brand-profile
