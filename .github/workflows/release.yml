name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing, for example 0.1.0
        required: true
        type: string
  # 白标仓库按品牌调用：构建指定源码版本，产物上传到调用方的运行记录，publish 为 true 时在调用方仓库发布 <品牌>/v<版本> 的 Release 并推送带品牌前缀的镜像。
  # 品牌来自调用方仓库的品牌目录（profile），或来自支持面构建任务的品牌快照（brand-job-id，需 SUPPORT_BUILD_TOKEN），二选一。
  workflow_call:
    inputs:
      version:
        description: Version to build, for example 0.1.0
        required: true
        type: string
      profile:
        description: Brand profile directory in the caller repository, for example brands/acme
        required: false
        type: string
        default: ""
      brand-job-id:
        description: Support build job ID whose brand snapshot is fetched from the support API; mutually exclusive with profile
        required: false
        type: string
        default: ""
      support-api-base:
        description: Support API base URL, for example https://luway.net; required with brand-job-id
        required: false
        type: string
        default: ""
      source-repository:
        description: Source repository to build, for example owner/repo
        required: true
        type: string
      source-ref:
        description: Source ref to build, for example v0.1.0
        required: true
        type: string
      publish:
        description: Publish a GitHub release in the caller repository
        required: false
        type: boolean
        default: false
    secrets:
      SUPPORT_BUILD_TOKEN:
        description: Shared token for the support build job API; required with brand-job-id
        required: false
      ES_USERNAME:
        description: SSL.com account username for eSigner Windows Authenticode signing
        required: true
      ES_PASSWORD:
        description: SSL.com account password for eSigner Windows Authenticode signing
        required: true
      ES_TOTP_SECRET:
        description: eSigner TOTP secret for unattended Authenticode signing
        required: true
      APPLE_CERTIFICATE_P12:
        description: Base64 PKCS12 archive containing a Developer ID Application identity and its intermediate certificate
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        description: Password for the PKCS12 archive
        required: true
      APPLE_API_KEY_P8:
        description: App Store Connect team API private key for notarization
        required: true
      APPLE_API_KEY_ID:
        description: App Store Connect API key ID
        required: true
      APPLE_API_ISSUER_ID:
        description: App Store Connect API issuer ID
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.profile || inputs['brand-job-id'] || 'oss' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 5
    outputs:
      artifact-prefix: ${{ steps.version.outputs.artifact-prefix }}
      brand-job-id: ${{ steps.version.outputs.brand-job-id }}
      brand-slug: ${{ steps.version.outputs.brand-slug }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      profile: ${{ steps.version.outputs.profile }}
      publish: ${{ steps.version.outputs.publish }}
      source-ref: ${{ steps.version.outputs.source-ref }}
      source-repository: ${{ steps.version.outputs.source-repository }}
      support-api-base: ${{ steps.version.outputs.support-api-base }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        if: inputs.profile == '' && inputs['brand-job-id'] == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version
        id: version
        env:
          BRAND_JOB_ID: ${{ inputs.brand-job-id }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
          SOURCE_REF: ${{ inputs.source-ref }}
          SOURCE_REPOSITORY: ${{ inputs.source-repository }}
          SUPPORT_API_BASE: ${{ inputs.support-api-base }}
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          # Windows Authenticode 经 eSigner CKA + wails3 tool sign，构建前确认账号与 TOTP。
          if [[ -z "$ES_USERNAME" || -z "$ES_PASSWORD" || -z "$ES_TOTP_SECRET" ]]; then
            echo "ES_USERNAME, ES_PASSWORD, and ES_TOTP_SECRET secrets must be configured for Windows code signing"
            exit 1
          fi

          source_repository="$GITHUB_REPOSITORY"
          source_ref="$GITHUB_SHA"
          artifact_prefix=""
          brand_slug=""
          if [[ -n "$PROFILE" && -n "$BRAND_JOB_ID" ]]; then
            echo "profile and brand-job-id are mutually exclusive"
            exit 1
          fi
          # 白标构建以品牌名区分同一次运行中各品牌的产物。
          if [[ -n "$BRAND_JOB_ID" ]]; then
            if [[ -z "$SUPPORT_API_BASE" || -z "$SUPPORT_BUILD_TOKEN" ]]; then
              echo "support-api-base input and SUPPORT_BUILD_TOKEN secret are required with brand-job-id"
              exit 1
            fi
            snapshot="$(curl -fsS -H "Authorization: Bearer $SUPPORT_BUILD_TOKEN" "$SUPPORT_API_BASE/api/support/v1/build-jobs/$BRAND_JOB_ID/brand")"
            slug="$(jq -r '.slug // empty' <<<"$snapshot")"
            if [[ ! "$slug" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "Brand snapshot slug is invalid: $slug"
              exit 1
            fi
            # 任务已在 running/终态时重跑 prepare 可能得到 409，与 report 一样视为可继续。
            running_status="$(curl -sS -o /tmp/prepare-running.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SUPPORT_BUILD_TOKEN" -H "Content-Type: application/json" \
              -d '{"status":"running"}' \
              "$SUPPORT_API_BASE/api/support/v1/build-jobs/$BRAND_JOB_ID/complete")"
            if [[ "$running_status" != 2* && "$running_status" != "409" ]]; then
              echo "Mark build job running failed with HTTP $running_status"
              cat /tmp/prepare-running.txt
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
            publish="$INPUT_PUBLISH"
            source_repository="$SOURCE_REPOSITORY"
            source_ref="$SOURCE_REF"
            artifact_prefix="${slug}-"
            brand_slug="$slug"
          elif [[ -n "$PROFILE" ]]; then
            if [[ ! "$PROFILE" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
              echo "Brand profile must be a relative directory path: $PROFILE"
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
            publish="$INPUT_PUBLISH"
            source_repository="$SOURCE_REPOSITORY"
            source_ref="$SOURCE_REF"
            artifact_prefix="${PROFILE##*/}-"
            brand_slug="${PROFILE##*/}"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag must point to a commit on main: $GITHUB_SHA"
              exit 1
            fi
          else
            tag="v${INPUT_VERSION#v}"
            publish=false
          fi

          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Version must be a semantic version such as v0.1.0 or v0.1.0-beta.1: $tag"
            exit 1
          fi

          version="${tag#v}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          # 白标 Release 的标签以品牌名为前缀。
          if [[ -n "$brand_slug" ]]; then
            tag="${brand_slug}/${tag}"
          fi

          echo "artifact-prefix=$artifact_prefix" >> "$GITHUB_OUTPUT"
          echo "brand-job-id=$BRAND_JOB_ID" >> "$GITHUB_OUTPUT"
          echo "brand-slug=$brand_slug" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "source-ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source-repository=$source_repository" >> "$GITHUB_OUTPUT"
          echo "support-api-base=$SUPPORT_API_BASE" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  server-assets:
    name: Server ${{ matrix.os }} ${{ matrix.arch }} assets
    needs: prepare
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Apply brand
        if: needs.prepare.outputs.profile != '' || needs.prepare.outputs.brand-job-id != ''
        uses: ./.github/actions/apply-brand
        with:
          profile: ${{ needs.prepare.outputs.profile }}
          brand-job-id: ${{ needs.prepare.outputs.brand-job-id }}
          support-api-base: ${{ needs.prepare.outputs.support-api-base }}
        env:
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build server archive
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_OS: ${{ matrix.os }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(jq -r .slug internal/common/brand/brand.json)"
          mkdir -p release-assets release-stage

          executable="${slug}-server"
          if [[ "$TARGET_OS" == "windows" ]]; then
            executable="${slug}-server.exe"
          fi

          CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build \
            -tags=server,production \
            -trimpath \
            -buildvcs=false \
            -ldflags="-w -s -X github.com/runforyou-ai/luway/internal/common/buildinfo.Version=${VERSION}" \
            -o "release-stage/$executable" \
            ./cmd/server

          asset="${slug}-server_${VERSION}_${TARGET_OS}_${TARGET_ARCH}"
          if [[ "$TARGET_OS" == "windows" ]]; then
            (cd release-stage && zip -q "../release-assets/${asset}.zip" "$executable")
          else
            tar -C release-stage -czf "release-assets/${asset}.tar.gz" "$executable"
          fi

      - name: Upload server assets
        uses: ./.github/actions/local-artifact
        with:
          operation: upload
          name: ${{ needs.prepare.outputs.artifact-prefix }}server-${{ matrix.os }}-${{ matrix.arch }}-assets
          path: release-assets/*

  # Linux 与 Windows 无界面执行器交叉编译；macOS 执行器随桌面任务完成签名和公证。
  executor-assets:
    name: Executor assets
    needs: prepare
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply brand
        if: needs.prepare.outputs.profile != '' || needs.prepare.outputs.brand-job-id != ''
        uses: ./.github/actions/apply-brand
        with:
          profile: ${{ needs.prepare.outputs.profile }}
          brand-job-id: ${{ needs.prepare.outputs.brand-job-id }}
          support-api-base: ${{ needs.prepare.outputs.support-api-base }}
        env:
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}

      - name: Build executor archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(jq -r .slug internal/common/brand/brand.json)"
          mkdir -p release-assets
          for os in linux windows; do
            for arch in amd64 arm64; do
              # 暂不发布 Windows arm64 执行器。
              if [[ "$os" == "windows" && "$arch" == "arm64" ]]; then
                continue
              fi
              stage="release-stage/${os}-${arch}"
              mkdir -p "$stage"
              executable="${slug}-executor"
              if [[ "$os" == "windows" ]]; then
                executable="${slug}-executor.exe"
              fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -tags=production \
                -trimpath \
                -buildvcs=false \
                -ldflags="-w -s -X github.com/runforyou-ai/luway/internal/common/buildinfo.Version=${VERSION}" \
                -o "$stage/$executable" \
                ./cmd/executor
              asset="${slug}-executor_${VERSION}_${os}_${arch}"
              if [[ "$os" == "windows" ]]; then
                (cd "$stage" && zip -q "$GITHUB_WORKSPACE/release-assets/${asset}.zip" "$executable")
              else
                tar -C "$stage" -czf "release-assets/${asset}.tar.gz" "$executable"
              fi
            done
          done

      - name: Upload executor assets
        uses: ./.github/actions/local-artifact
        with:
          operation: upload
          name: ${{ needs.prepare.outputs.artifact-prefix }}executor-assets
          path: release-assets/*

  # 执行器镜像与服务端镜像同样在 publish 为 true 时推送；白标镜像带品牌前缀。
  executor-container:
    name: Executor container
    needs: prepare
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false

      - name: Apply brand
        if: needs.prepare.outputs.profile != '' || needs.prepare.outputs.brand-job-id != ''
        uses: ./.github/actions/apply-brand
        with:
          profile: ${{ needs.prepare.outputs.profile }}
          brand-job-id: ${{ needs.prepare.outputs.brand-job-id }}
          support-api-base: ${{ needs.prepare.outputs.support-api-base }}
        env:
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: local-${{ github.repository_id }}-${{ runner.name }}
          keep-state: true
          cache-binary: false

      - name: Login to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-executor
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.brand-slug == '' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.brand-slug == '' && needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.prepare.outputs.brand-slug }}-${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.brand-slug != '' }}
            type=raw,value=${{ needs.prepare.outputs.brand-slug }}-latest,enable=${{ needs.prepare.outputs.brand-slug != '' && needs.prepare.outputs.prerelease == 'false' }}

      - name: Build and optionally push container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.executor
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      # 私有调用方（如白标仓）所在组织常无 attestation 额度，跳过以免镜像已推送后仍失败。
      - name: Attest published container
        if: needs.prepare.outputs.publish == 'true' && github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-executor
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  linux-desktop-assets:
    name: Linux ${{ matrix.arch }} desktop assets
    needs: prepare
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 90
    env:
      CI_PACKAGE_CONTAINER: ci-package-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false
      - name: Apply brand
        if: needs.prepare.outputs.profile != '' || needs.prepare.outputs.brand-job-id != ''
        uses: ./.github/actions/apply-brand
        with:
          profile: ${{ needs.prepare.outputs.profile }}
          brand-job-id: ${{ needs.prepare.outputs.brand-job-id }}
          support-api-base: ${{ needs.prepare.outputs.support-api-base }}
        env:
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64
          cache-image: false
      - name: Build packaging environment
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          go_version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          wails_version="$(awk '$1 == "github.com/wailsapp/wails/v3" { print $2; exit }' go.mod)"
          image="ci-linux-package:${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET_ARCH}"
          docker buildx build --builder default --platform "linux/$TARGET_ARCH" --load \
            --build-arg "GO_VERSION=$go_version" --build-arg "WAILS_VERSION=$wails_version" \
            -f build/docker/Dockerfile.linux-ci -t "$image" .
          echo "PACKAGE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Build Linux packages
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cache="$HOME/ci/cache/linux-package/$TARGET_ARCH"
          mkdir -p "$cache/go-build" "$cache/go-mod" "$cache/npm"
          # 整个打包流程在目标架构环境中执行，AppImage 收集对应架构的系统库。
          docker run --rm --name "$CI_PACKAGE_CONTAINER" --platform "linux/$TARGET_ARCH" --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$cache:/cache" \
            -e HOME=/tmp -e GOPATH=/tmp/go -e GOCACHE=/cache/go-build -e GOMODCACHE=/cache/go-mod \
            -e npm_config_cache=/cache/npm -e GOMAXPROCS=4 -e GOMEMLIMIT=4GiB \
            -e TARGET_ARCH -e VERSION -e BUILD_NUMBER "$PACKAGE_IMAGE" \
            bash build/scripts/ci-linux-package.sh
      - name: Upload Linux desktop assets
        uses: ./.github/actions/local-artifact
        with:
          operation: upload
          name: ${{ needs.prepare.outputs.artifact-prefix }}linux-${{ matrix.arch }}-desktop-assets
          path: release-assets/*
      - name: Stop packaging container
        if: always()
        run: docker rm --force --volumes "$CI_PACKAGE_CONTAINER" 2>/dev/null || true
      - name: Remove temporary packaging image tag
        if: always() && env.PACKAGE_IMAGE != ''
        run: docker image rm "$PACKAGE_IMAGE"

  windows-desktop-assets:
    name: Windows ${{ matrix.arch }} desktop assets
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, Windows, ARM64, vmpal-ci]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Apply brand
        if: needs.prepare.outputs.profile != '' || needs.prepare.outputs.brand-job-id != ''
        uses: ./.github/actions/apply-brand
        with:
          profile: ${{ needs.prepare.outputs.profile }}
          brand-job-id: ${{ needs.prepare.outputs.brand-job-id }}
          support-api-base: ${{ needs.prepare.outputs.support-api-base }}
        env:
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisDirectory = if ($env:NSIS_HOME) { $env:NSIS_HOME } else { "${env:ProgramFiles(x86)}\NSIS" }
          if (-not (Test-Path "$nsisDirectory\makensis.exe")) {
            throw "Install NSIS on this runner and set NSIS_HOME before building installers"
          }
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found; install the Windows SDK on this runner"
          }
          Split-Path $signtool.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using $($signtool.FullName)"

      - name: Set package version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: go run build/scripts/set_release_version.go "$VERSION" "$BUILD_NUMBER"

      - name: Build Windows AMD64 executable
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          wails3 task windows:build ARCH=amd64 APP_VERSION="$env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Sign executable and package signed installer
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        shell: pwsh
        run: |
          $slug = (Get-Content internal/common/brand/brand.json -Raw | ConvertFrom-Json).slug
          & ./build/scripts/ci-sign-windows.ps1 -Executable "bin/$slug.exe" -Installer "bin/$slug-amd64-installer.exe" -Package {
            wails3 task windows:package:from-bin ARCH=amd64 INSTALL_SCOPE=user
            if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "bin/$slug-amd64-installer.exe" "release-assets/${slug}_$($env:VERSION)_windows_amd64-installer.exe"
          Compress-Archive -Path "bin/$slug.exe" -DestinationPath "release-assets/${slug}_$($env:VERSION)_windows_amd64.zip"

      - name: Upload Windows desktop assets
        uses: ./.github/actions/local-artifact
        with:
          operation: upload
          name: ${{ needs.prepare.outputs.artifact-prefix }}windows-${{ matrix.arch }}-desktop-assets
          path: release-assets/*

  darwin-desktop-assets:
    name: macOS desktop assets
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64, vmpal-ci]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Apply brand
        if: needs.prepare.outputs.profile != '' || needs.prepare.outputs.brand-job-id != ''
        uses: ./.github/actions/apply-brand
        with:
          profile: ${{ needs.prepare.outputs.profile }}
          brand-job-id: ${{ needs.prepare.outputs.brand-job-id }}
          support-api-base: ${{ needs.prepare.outputs.support-api-base }}
        env:
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}

      - name: Set package version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: go run build/scripts/set_release_version.go "$VERSION" "$BUILD_NUMBER"

      - name: Build ARM64 macOS assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          wails3 task darwin:package ARCH=arm64 APP_VERSION="$VERSION"
          wails3 task build:executor GOOS=darwin ARCH=arm64 APP_VERSION="$VERSION"

      - name: Sign and notarize ARM64 macOS assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: wails3 task darwin:release:sign ARCH=arm64 APP_VERSION="$VERSION"

      - name: Preserve notarization reports
        if: always()
        uses: ./.github/actions/local-artifact
        with:
          operation: upload
          name: ${{ needs.prepare.outputs.artifact-prefix }}macos-notarization-reports
          path: ${{ runner.temp }}/notarization-reports/*.json

      - name: Upload macOS desktop assets
        uses: ./.github/actions/local-artifact
        with:
          operation: upload
          name: ${{ needs.prepare.outputs.artifact-prefix }}darwin-desktop-assets
          path: release-assets/*

  container:
    name: Server container
    needs:
      - prepare
      - server-assets
      - executor-assets
      - linux-desktop-assets
      - windows-desktop-assets
      - darwin-desktop-assets
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Apply brand
        if: needs.prepare.outputs.profile != '' || needs.prepare.outputs.brand-job-id != ''
        uses: ./.github/actions/apply-brand
        with:
          profile: ${{ needs.prepare.outputs.profile }}
          brand-job-id: ${{ needs.prepare.outputs.brand-job-id }}
          support-api-base: ${{ needs.prepare.outputs.support-api-base }}
        env:
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Download desktop assets
        uses: ./.github/actions/local-artifact
        with:
          operation: download
          pattern: ${{ needs.prepare.outputs.artifact-prefix }}*-desktop-assets
          path: ${{ runner.temp }}/client-assets

      - name: Download executor assets
        uses: ./.github/actions/local-artifact
        with:
          operation: download
          name: ${{ needs.prepare.outputs.artifact-prefix }}executor-assets
          path: ${{ runner.temp }}/client-assets

      - name: Download server assets
        uses: ./.github/actions/local-artifact
        with:
          operation: download
          pattern: ${{ needs.prepare.outputs.artifact-prefix }}server-*-assets
          path: ${{ runner.temp }}/client-assets

      - name: Build release manifest
        env:
          RELEASE: ${{ runner.temp }}/release
          CLIENT_ASSETS: ${{ runner.temp }}/client-assets
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: go run ./build/scripts/releasemanifest -desktop-platforms windows,darwin,linux -version "$VERSION" -source "$CLIENT_ASSETS" -output "$RELEASE"

      # 发布清单随 Release 发布，服务端下载客户端文件时据此校验大小与摘要。
      - name: Upload release manifest
        uses: ./.github/actions/local-artifact
        with:
          operation: upload
          name: ${{ needs.prepare.outputs.artifact-prefix }}release-manifest-assets
          path: ${{ runner.temp }}/release/release.json

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: local-${{ github.repository_id }}-${{ runner.name }}
          keep-state: true
          cache-binary: false

      # 服务端镜像在 publish 为 true 时推送，白标镜像带品牌前缀。
      - name: Login to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.brand-slug == '' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.brand-slug == '' && needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.prepare.outputs.brand-slug }}-${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.brand-slug != '' }}
            type=raw,value=${{ needs.prepare.outputs.brand-slug }}-latest,enable=${{ needs.prepare.outputs.brand-slug != '' && needs.prepare.outputs.prerelease == 'false' }}

      - name: Build and optionally push container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/docker/Dockerfile.server
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          build-contexts: |
            release=${{ runner.temp }}/release
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      # 私有调用方（如白标仓）所在组织常无 attestation 额度，跳过以免镜像已推送后仍失败。
      - name: Attest published container
        if: needs.prepare.outputs.publish == 'true' && github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish GitHub release
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - server-assets
      - executor-assets
      - linux-desktop-assets
      - windows-desktop-assets
      - darwin-desktop-assets
      - container
      - executor-container
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-ref }}
          persist-credentials: false

      - name: Download release assets
        uses: ./.github/actions/local-artifact
        with:
          operation: download
          pattern: ${{ needs.prepare.outputs.artifact-prefix }}*-assets
          path: release-assets

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      # 产物证明只用于公开仓库的开源版 Release。
      - name: Attest release assets
        if: needs.prepare.outputs.brand-slug == '' && github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          BRAND_SLUG: ${{ needs.prepare.outputs.brand-slug }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          notes="$(cat <<'EOF'
          Windows 安装程序与更新包已通过 eSigner Authenticode 签名。桌面端提供 Linux amd64/arm64、macOS arm64、Windows amd64；服务端提供 Linux amd64/arm64。macOS 桌面端与执行器使用 Developer ID 签名并通过 Apple 公证。
          EOF
          )"
          # 开源版使用已推送的标签并生成变更说明；白标版（品牌目录或品牌快照）在调用方当前提交上创建标签。
          if [[ -n "$BRAND_SLUG" ]]; then
            args=(--target "$GITHUB_SHA" --notes "$notes")
          else
            args=(--verify-tag --generate-notes --notes "$notes")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" release-assets/*

  # 品牌快照构建结束后向支持面回报结果；依赖任务被跳过或失败时仍然运行。
  # prepare 失败时其 outputs 为空，改读 workflow 输入，避免任务一直停在 running/queued。
  report:
    name: Report build job
    if: always() && (needs.prepare.outputs.brand-job-id != '' || inputs['brand-job-id'] != '')
    needs:
      - prepare
      - server-assets
      - executor-assets
      - linux-desktop-assets
      - windows-desktop-assets
      - darwin-desktop-assets
      - container
      - executor-container
      - publish
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 5

    steps:
      - name: Report build result
        env:
          BRAND_JOB_ID: ${{ needs.prepare.outputs.brand-job-id || inputs['brand-job-id'] }}
          BRAND_SLUG: ${{ needs.prepare.outputs.brand-slug }}
          NEEDS: ${{ toJSON(needs) }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUPPORT_API_BASE: ${{ needs.prepare.outputs.support-api-base || inputs['support-api-base'] }}
          SUPPORT_BUILD_TOKEN: ${{ secrets.SUPPORT_BUILD_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version || inputs.version }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # GHCR 镜像路径必须小写，与 docker/metadata-action 推送结果一致。
          IMAGE_REPOSITORY="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # 任一依赖任务失败或被取消即视为失败；未执行的任务（如 publish 为 false 时的发布任务）不算失败。
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")"

          if [[ -n "$failed" ]]; then
            body="$(jq -n --arg message "Build failed in jobs: $failed. Run: $RUN_URL" '{status: "failed", errorMessage: $message}')"
          else
            # 只有镜像已推送时才回报镜像标签。
            tags='[]'
            if [[ "$PUBLISH" == "true" && -n "$BRAND_SLUG" ]]; then
              tags="$(jq -n --arg repository "$IMAGE_REPOSITORY" --arg slug "$BRAND_SLUG" --arg version "$VERSION" --arg prerelease "$PRERELEASE" '
                [$repository + "-server", $repository + "-executor"] as $images
                | [$images[] | . + ":" + $slug + "-" + $version]
                  + (if $prerelease == "false" then [$images[] | . + ":" + $slug + "-latest"] else [] end)')"
            else
              echo "Images were not pushed because publish is false or brand slug is unavailable"
            fi
            body="$(jq -n --argjson tags "$tags" '{status: "succeeded", imageTags: $tags}')"
          fi

          # 任务已结束时服务端返回 409，重复回报不算失败。
          status="$(curl -sS -o /tmp/report-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SUPPORT_BUILD_TOKEN" -H "Content-Type: application/json" \
            -d "$body" \
            "$SUPPORT_API_BASE/api/support/v1/build-jobs/$BRAND_JOB_ID/complete")"
          if [[ "$status" != 2* && "$status" != "409" ]]; then
            echo "Report build result failed with HTTP $status"
            cat /tmp/report-response.txt
            exit 1
          fi
