  container:
    name: Container
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Build server binary
        run: wails3 task common:build:server:container-binary ARCH=arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: local-${{ github.repository_id }}-${{ runner.name }}
          keep-state: true
          cache-binary: false

      # 运行镜像的构建上下文只包含当前服务端程序。
      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bin/server-image
          file: build/docker/Dockerfile.server-runtime
          platforms: linux/arm64
          push: false
          tags: app:ci

