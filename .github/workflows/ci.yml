name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Keep the required check available if a merge queue is enabled later.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Native build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, Windows, ARM64, vmpal-ci]
            platform: windows
          - runner: [self-hosted, macOS, ARM64, vmpal-ci]
            platform: darwin
          - runner: [self-hosted, Linux, ARM64, vmpal-ci]
            platform: linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ runner.os != 'Windows' }}
      # 只保留当前工作区的一份依赖；其他未跟踪文件和生成物照常清理。
      - name: Clean Windows workspace except frontend dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -ffdx -e frontend/node_modules/
      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Reuse or install Windows frontend dependencies
        if: runner.os == 'Windows'
        run: |
          node build/scripts/ci-frontend-deps.mjs frontend
          "CI_FRONTEND_DEPS_READY=true" >> $env:GITHUB_ENV
      - name: Build native desktop
        run: wails3 task ${{ matrix.platform }}:build ARCH=arm64

  server-check:
    name: Server checks
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 服务端 go:embed 只需要 Messenger 产物和非空的 frontend/dist；前端生产构建由 Desktop 任务检查。
      - name: Prepare embedded frontend assets
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>App</title>' > frontend/dist/index.html
          wails3 task common:build:messenger

      - name: Verify release manifest and shared artifacts
        run: wails3 task check:ci:release

      - name: Check Go server build and architecture
        run: wails3 task check:server

      - name: Lint Go server build
        run: wails3 task check:lint:server

  server-test:
    name: Server tests ${{ matrix.shard }}
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [A, B]
    env:
      CI_POSTGRES_CONTAINER: local-ci-${{ github.run_id }}-${{ github.run_attempt }}-server-${{ matrix.shard }}
      CI_S3_CONTAINER: local-ci-${{ github.run_id }}-${{ github.run_attempt }}-s3-${{ matrix.shard }}
      SERVER_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 依赖容器在后台运行，健康检查与工具链准备和前端构建并行。
      - name: Start integration test dependencies
        shell: bash
        run: |
          cp .env.example .env
          docker run --detach --name "$CI_POSTGRES_CONTAINER" \
            --env POSTGRES_DB=main \
            --env POSTGRES_USER=luway \
            --env POSTGRES_PASSWORD=luway \
            --publish 127.0.0.1::5432 \
            --health-cmd='pg_isready -U luway -d main' \
            --health-interval=2s --health-timeout=5s --health-retries=15 \
            ghcr.io/runforyou-ai/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
          port="$(docker port "$CI_POSTGRES_CONTAINER" 5432/tcp | awk -F: '{print $NF}')"
          sed -i "s/^POSTGRES_PORT=.*/POSTGRES_PORT=$port/" .env
          docker run --detach --name "$CI_S3_CONTAINER" \
            --env RUSTFS_ACCESS_KEY=luway-test --env RUSTFS_SECRET_KEY=luway-test-secret \
            --env RUSTFS_CONSOLE_ENABLE=false --tmpfs /data:mode=0777 \
            --publish 127.0.0.1::9000 \
            --health-cmd='curl -fsS http://127.0.0.1:9000/health' \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          s3_port="$(docker port "$CI_S3_CONTAINER" 9000/tcp | awk -F: '{print $NF}')"
          sed -i "s|^TEST_S3_ENDPOINT=.*|TEST_S3_ENDPOINT=http://127.0.0.1:$s3_port|" .env

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 服务端 go:embed 只需要 Messenger 产物和非空的 frontend/dist；前端生产构建由 Desktop 任务检查。
      - name: Prepare embedded frontend assets
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>App</title>' > frontend/dist/index.html
          wails3 task common:build:messenger

      - name: Wait for integration test dependencies
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$CI_POSTGRES_CONTAINER")"
            if [[ "$status" == healthy || "$status" == unhealthy ]]; then break; fi
            sleep 2
          done
          if [[ "$status" != healthy ]]; then
            docker logs "$CI_POSTGRES_CONTAINER"
            echo "Integration test dependency "$CI_POSTGRES_CONTAINER" is $status"
            exit 1
          fi
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$CI_S3_CONTAINER")"
            if [[ "$status" == healthy || "$status" == unhealthy ]]; then break; fi
            sleep 2
          done
          if [[ "$status" != healthy ]]; then
            docker logs "$CI_S3_CONTAINER"
            exit 1
          fi
          # 新建的测试库从 template1 继承数据库扩展。
          for database in main template1; do
            docker exec "$CI_POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U luway -d "$database" \
              -c 'CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;'
          done

      - name: Run server integration tests
        run: wails3 task test:server:run

      - name: Stop integration test dependencies
        if: always()
        run: |
          docker rm --force --volumes "$CI_S3_CONTAINER" || true
          docker logs "$CI_POSTGRES_CONTAINER" || true
          docker rm --force --volumes "$CI_POSTGRES_CONTAINER" || true

  server:
    name: Server
    if: ${{ always() }}
    needs: [server-check, server-test]
    runs-on: [self-hosted, Linux, ARM64, vmpal-ci]
    timeout-minutes: 5
    steps:
      - name: Require all Server checks and test shards
        env:
          CHECK_RESULT: ${{ needs.server-check.result }}
          TEST_RESULT: ${{ needs.server-test.result }}
        run: |
          [[ "$CHECK_RESULT" == success && "$TEST_RESULT" == success ]]

