name: runforyou

volumes:
  luway-postgres-data:
  luway-nats-data:
  rustfs-data:

services:
  postgres:
    container_name: luway-postgres
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: luway
      POSTGRES_PASSWORD: luway
    ports:
      - "5432:5432"
    volumes:
      - luway-postgres-data:/var/lib/postgresql

  nats:
    container_name: luway-nats
    image: nats:2.14.5-alpine
    command:
      - --name=luway-local
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - luway-nats-data:/data/jetstream

  rustfs:
    container_name: runforyou-rustfs
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: runforyou
      RUSTFS_SECRET_KEY: runforyou
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
